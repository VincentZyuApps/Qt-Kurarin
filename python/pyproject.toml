[project]
name = "qt-kurarin"
version = "0.2.4-rc.1+2026624"
description = "> 🖥️ Qt-powered Kyuukurarin (きゅうくらりん) on your desktop — animated sprites in sync with the music 🎵"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "PyQt6>=6.0,<7",
    "textual>=6.0,<7",
]

[project.scripts]
qt-kurarin = "qt_kurarin.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qt_kurarin"]

[tool.hatch.build.targets.sdist]
include = [
    "src/qt_kurarin/**",
    "pyproject.toml",
    "README.md",
    "requirements.txt",
    "uv.lock",
    "uv.md",
]
